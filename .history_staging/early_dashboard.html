<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RaceCount</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
</head>
<body>
  <div class="console">
    <div class="video-panel" id="videoPanel">
      <img id="videoFeed" src="/video_feed" alt="Live camera feed" />
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
      <div class="offline-banner">
        <div class="title">Camera signal lost</div>
        <div class="subtitle">RaceCount will keep retrying automatically — no action needed unless this persists for more than a minute or two.</div>
      </div>
    </div>

    <div class="rail">
      <div class="tile" data-dir="left">
        <div class="tile-label">Left</div>
        <div class="tile-value" id="countLeft">0</div>
      </div>
      <div class="tile" data-dir="straight">
        <div class="tile-label">Straight</div>
        <div class="tile-value" id="countStraight">0</div>
      </div>
      <div class="tile" data-dir="right">
        <div class="tile-label">Right</div>
        <div class="tile-value" id="countRight">0</div>
      </div>

      <div class="footer-row">
        <div class="footer-card">
          <span>Total counted</span>
          <strong id="countTotal">0</strong>
        </div>
        <div class="footer-card">
          <span>Session started</span>
          <strong id="sessionStart">—</strong>
        </div>
      </div>

      <button class="reset-button" id="resetButton">Reset counts</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
