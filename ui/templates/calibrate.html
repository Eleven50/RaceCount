<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RaceCount — Calibrate Zones</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='calibrate.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='nav-guard.css') }}" />
</head>
<body class="calibrate-body">
  <div class="cal-screen" id="calImageWrap" data-active-gates="{{ active_gates|tojson|forceescape }}">

    <img id="calImage" class="cal-image" alt="Camera view for calibration" style="display:none" />
    <svg id="calOverlay" class="cal-overlay"></svg>

    <div class="cal-loading" id="calLoading">
      <div class="cal-spinner"></div>
      <div>Fetching a frame from the camera…</div>
    </div>

    <div class="cal-error" id="calError" style="display:none">
      <div class="cal-error-title">No camera frame available</div>
      <div class="cal-error-sub" id="calErrorDetail">Check the camera connection, then retry.</div>
      <button class="cal-btn cal-btn-primary" id="calRetryBtn">Retry</button>
    </div>

    <!-- Floating overlays — the camera frame itself fills the whole screen -->
    <div class="cal-top-bar">
      <a href="/" class="cal-back" aria-label="Back to dashboard">&larr;</a>
      <div class="cal-prompt-block">
        <div class="cal-prompt" id="calPrompt">Loading camera frame…</div>
        <div class="cal-legend" id="calLegend"></div>
        <div class="cal-partial-warning" id="calPartialWarning" style="display:none"></div>
      </div>
      <div class="cal-progress" id="calProgress"></div>
    </div>

    <div class="cal-bottom-bar">
      <button class="cal-btn" id="calUndoBtn">Undo point</button>
      <button class="cal-btn" id="calRetakeBtn">Retake snapshot</button>
      <button class="cal-btn cal-btn-danger" id="calRestartBtn">Start over</button>
      <button class="cal-btn cal-btn-primary" id="calNextBtn" style="display:none">Next gate</button>
      <button class="cal-btn cal-btn-primary" id="calSaveBtn" style="display:none">Save zones</button>
    </div>

    <div class="cal-toast" id="calToast" style="display:none"></div>
  </div>

  <script src="{{ url_for('static', filename='nav-guard.js') }}"></script>
  <script src="{{ url_for('static', filename='calibrate.js') }}"></script>
</body>
</html>
