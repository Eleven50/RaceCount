{% extends "base.html" %}
{% block title %}RaceCount — Home{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}" />
{% endblock %}

{% block content %}
<div class="home-grid">
  <a href="/start" class="home-tile home-tile-start">
    <span class="home-tile-label">Start</span>
    <span class="home-tile-sub">Begin a new counting session</span>
  </a>

  <a href="/settings" class="home-tile home-tile-secondary">
    <span class="home-tile-label">Settings</span>
    <span class="home-tile-sub">Display &amp; advanced options</span>
  </a>

  <a href="/calibrate" class="home-tile home-tile-secondary">
    <span class="home-tile-label">Calibrate</span>
    <span class="home-tile-sub">Set the 3 gate lines</span>
  </a>
  <a href="/history" class="home-tile home-tile-secondary">
    <span class="home-tile-label">History</span>
    <span class="home-tile-sub">Past mobs &amp; counts</span>
  </a>
</div>
{% endblock %}
