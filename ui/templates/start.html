{% extends "base.html" %}
{% block title %}RaceCount — Start{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='start.css') }}" />
{% endblock %}

{% block content %}
<div class="start-screen">

  <div class="start-mode-toggle">
    <button class="start-mode-btn active" id="modeCreateBtn" data-mode="create">Create Mob</button>
    <button class="start-mode-btn" id="modeUsePreviousBtn" data-mode="previous">Use Previous</button>
  </div>

  <div class="start-body">

    <div class="start-panel" id="createPanel">
      <div class="start-field start-field-full">
        <label class="start-field-label" for="mobNameInput">Mob name</label>
        <input class="start-field-input" type="text" id="mobNameInput" placeholder="e.g. Hoggets, 2 tooths" maxlength="60" autocomplete="off" />
      </div>
      <div class="start-field-row" id="gateFieldsRow" data-active-gates="{{ active_gates|tojson|forceescape }}">
        {% for gate in active_gates %}
        <div class="start-field">
          <label class="start-field-label gate-{{ gate }}" for="{{ gate }}NameInput">{{ gate|capitalize }} gate</label>
          <input class="start-field-input" type="text" id="{{ gate }}NameInput" placeholder="e.g. {{ {'left': 'Selling', 'straight': 'Pokers', 'right': 'Works'}[gate] }}" maxlength="40" autocomplete="off" />
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="start-panel" id="previousPanel" style="display:none">
      <div class="start-mob-list" id="mobList">
        <div class="start-mob-list-loading">Loading previous mobs…</div>
      </div>
    </div>

  </div>

  <div class="start-footer">
    <button class="ml-btn ml-btn-primary start-confirm-btn" id="confirmBtn" disabled>Create Mob</button>
  </div>

  <div class="start-toast" id="startToast" style="display:none"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='start.js') }}"></script>
{% endblock %}
